<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cloudy Photobooth</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px;background:linear-gradient(135deg,#eafaff,#b9e7ff);font-family:Arial,sans-serif;color:#315d7a;text-align:center}.app{max-width:760px;margin:auto}.logo{display:inline-block;background:#fff;border:4px solid #9edcff;border-radius:999px;padding:9px 20px;box-shadow:0 6px #77bce5}h1{font:clamp(34px,8vw,56px) Georgia;color:#397eaa;margin:18px 0 8px}.sub{color:#5684a0}.booth{background:#fff;border:5px solid #fff;border-radius:30px;padding:16px;box-shadow:0 14px #84c7eb,0 25px 40px #477fa633}.camera{position:relative;aspect-ratio:4/3;background:#23485e;border:7px solid #d6f3ff;border-radius:24px;overflow:hidden}.camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}.label{position:absolute;top:12px;left:12px;background:#fff;border:3px solid #9edcff;border-radius:20px;padding:5px 10px;font-size:12px}.count{display:none;position:absolute;inset:0;place-items:center;color:white;font-size:110px;text-shadow:4px 4px #4b8fbe;background:#4b8fbe44}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:16px}button{border:0;border-radius:999px;padding:13px 18px;background:#78c5f1;color:white;font-weight:bold;cursor:pointer;box-shadow:0 5px #4b9aca}button.alt{background:#fff;color:#4b8fbe;box-shadow:0 5px #b6ddeb}button.pink{background:#ffafd0;box-shadow:0 5px #df8eb0}button:disabled{opacity:.45}.status{min-height:22px;margin-top:14px;font-size:14px}.tip{font-size:12px;opacity:.65}.result{display:none;margin-top:30px}#strip{width:min(100%,360px);background:#fff;padding:12px 12px 22px;border-radius:18px;border:5px solid #d5f2ff;box-shadow:0 12px 25px #477fa633}</style></head><body><main class="app"><div class="logo">☁️ little cloud studio ☁️</div><h1>Cloudy Photobooth 🩵</h1><p class="sub">Pose lucu, senyum manis, dan simpan kenanganmu ♡</p><section class="booth"><div class="camera"><video id="video" autoplay playsinline></video><div class="label">● LIVE CAMERA</div><div id="count" class="count"></div></div><div class="controls"><button id="start">📷 Mulai Kamera Laptop</button><button id="take" disabled>🩵 Ambil Foto</button><button id="reset" class="alt">↻ Ulangi</button></div><div id="status" class="status">Klik “Mulai Kamera Laptop” ☁️</div><p class="tip">Izinkan akses kamera saat browser meminta izin.</p></section><section id="result" class="result"><h2>Hasil Photostrip Kamu 🐳</h2><canvas id="strip"></canvas><div class="controls"><button id="download" class="pink">⬇ Simpan Photostrip</button></div></section></main><canvas id="capture" hidden></canvas><script>
const v=document.getElementById("video"),cap=document.getElementById("capture"),cnt=document.getElementById("count"),start=document.getElementById("start"),take=document.getElementById("take"),reset=document.getElementById("reset"),status=document.getElementById("status"),result=document.getElementById("result"),strip=document.getElementById("strip"),download=document.getElementById("download");let stream=null,photos=[];const wait=m=>new Promise(r=>setTimeout(r,m));
start.onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});v.srcObject=stream;take.disabled=false;start.disabled=true;status.textContent="Kamera laptop siap! 🩵"}catch(e){status.textContent="Kamera gagal dibuka. Izinkan akses kamera."}};
async function countdown(){cnt.style.display="grid";for(let n=3;n>0;n--){cnt.textContent=n;await wait(700)}cnt.textContent="♡";await wait(350);cnt.style.display="none"}
take.onclick=async()=>{take.disabled=true;await countdown();let w=v.videoWidth,h=v.videoHeight;cap.width=w;cap.height=h;let c=cap.getContext("2d");c.save();c.translate(w,0);c.scale(-1,1);c.drawImage(v,0,0,w,h);c.restore();photos.push(cap.toDataURL("image/jpeg",.93));status.textContent=photos.length<4?"Foto tersimpan! Pose berikutnya ✨":"Selesai! Photostrip jadi 🩵";if(photos.length<4)take.disabled=false;else{render();result.style.display="block"}};
function render(){let W=900,H=2340;strip.width=W;strip.height=H;let c=strip.getContext("2d");c.fillStyle="#fff";c.fillRect(0,0,W,H);photos.forEach((s,i)=>{let im=new Image();im.onload=()=>{let y=20+i*560;c.drawImage(im,60,y,780,500);c.fillStyle="#4b8fbe";c.font="30px Georgia";c.textAlign="center";c.fillText(i===3?"♡ cloud memories ♡":"♡",450,y+535)};im.src=s})}
reset.onclick=()=>{photos=[];result.style.display="none";status.textContent=stream?"Kamera siap! 🩵":"Klik “Mulai Kamera Laptop” ☁️";take.disabled=!stream};download.onclick=()=>{let a=document.createElement("a");a.download="cloudy-photostrip.jpg";a.href=strip.toDataURL("image/jpeg",.95);a.click()};
</script></body></html>
